[project]
name = "galaxy-rotation-worlds"
version = "0.2.0"
description = "MetaLaw Discovery System v0.2-FROZEN: Hypothesis comparison over galaxy rotation curves"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
